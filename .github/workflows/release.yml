# Publishes a Banter release when a tag v<version> is pushed. <version> must
# equal the version in the root package.json. The release carries notes
# taken from the version's section of CHANGELOG.md, and the dsh voice plugin
# built from the tagged commit, which installs with
# `dsh plugin --profile <profile> add ./<file>.tgz`.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0  # the whole history and tags, for the list of changes since the last release

      - uses: oven-sh/setup-bun@v2

      - name: Check the tag matches the version
        run: |
          version="$(jq -r .version package.json)"
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match package.json version ${version}" >&2
            exit 1
          fi

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test the dsh plugin
        working-directory: plugins/dsh/voice
        run: bun run test

      - name: Build and pack the dsh plugin
        working-directory: plugins/dsh/voice
        run: |
          bun run build
          cd dist/package
          npm pack --pack-destination "$GITHUB_WORKSPACE"

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tarball="$(ls banter-dsh-voice-*.tgz)"
          cat > notes.md <<EOF
          Install or update Banter from this tag: see the [install guide](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}/docs/guide/install.md).

          **DeepSeek Harness plugin.** \`${tarball}\` is Banter's voice mode for DeepSeek Harness, built from this release; it needs a Banter server. Download it, fully quit the desktop app, then run \`dsh plugin --profile desktop add ./${tarball}\` (or \`--profile web\` for \`dsh web\`), start dsh, and set the Banter server URL on the plugin's page in Plugins. See the [plugin setup guide](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}/docs/guide/plugins/dsh-voice/setup.md).
          EOF
          # The changes: this version's section of CHANGELOG.md, without its heading.
          version="${GITHUB_REF_NAME#v}"
          awk -v v="## $version" '$0 == v { on = 1; next } on && /^## / { exit } on' CHANGELOG.md > changes.md
          if ! grep -q '[^[:space:]]' changes.md; then
            echo "CHANGELOG.md has no section for $version" >&2
            exit 1
          fi
          previous="$(git describe --tags --abbrev=0 --match 'v*' "${GITHUB_REF_NAME}^" 2>/dev/null || true)"
          {
            # Links in CHANGELOG.md are relative to the repo root; the release page needs them absolute.
            sed -E "s|\]\(([^):#][^):]*)\)|](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}/\1)|g" changes.md
            if [ -n "$previous" ]; then
              echo
              echo "**Full changelog**: https://github.com/${GITHUB_REPOSITORY}/compare/${previous}...${GITHUB_REF_NAME}"
            fi
          } >> notes.md
          gh release create "${GITHUB_REF_NAME}" "${tarball}" \
            --title "Banter ${GITHUB_REF_NAME}" \
            --notes-file notes.md
