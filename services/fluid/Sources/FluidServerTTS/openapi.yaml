openapi: "3.1.0"
info:
  title: fluid-tts
  version: "1.0.0"
  description: |
    An OpenAI-compatible speech synthesis server over FluidAudio's CoreML
    backends.

    One model is resident at a time, and one operation runs against it.
    FluidAudio issue #661 reports EXC_BAD_ACCESS in libBNNS when two managers
    predict concurrently, and upstream's Architecture.md states CoreML is not
    reentrant. Streaming makes that constraint sharper: synthesis returns its
    stream immediately and keeps predicting after the call returns, so the
    resident slot is held until the work actually ends rather than until its
    caller walks away.

    The model lifecycle here matches the transcription server's, endpoint for
    endpoint and shape for shape, because a client written against one and
    pointed at the other should not have to tell them apart.

    Two endpoints are deliberately absent. Streaming synthesis for the voice
    loop is a WebSocket at /v1/audio/stream, and OpenAPI has no WebSocket
    concept. And /v1/audio/speech takes the union of what nine backends accept,
    each reading the parameters it has and ignoring the rest, so a schema would
    either reject a field some backend needs or document a shape no backend
    implements. Both are described in BUILD.md.

    What /v1/audio/speech returns: one container per response, streamed as
    synthesis produces it. `response_format` selects `aac` (the default, AAC-LC in
    ADTS), `wav`, or `pcm`, and anything else is refused rather than silently
    substituted. `pcm` is headerless 16-bit mono at 24 kHz, as OpenAI defines
    it, whatever rate the model produces: a client cannot be told the rate of
    raw samples, so a 44.1 or 48 kHz model is resampled.

    Who speaks: `voice` names a voice from the roster of the registry this
    server was started with, and the server finds what the model needs for her,
    whether that is the model's own name or a recording to clone from. A roster
    voice the model does not offer is refused with a 400 naming both. A name
    the roster does not hold is passed to the model as its own. A request that
    sends `ref_audio` has chosen its recording and nothing is looked up. The
    socket's `speak` frame follows the same rule. The rule is stated in
    docs/reference/design/model-roster.md, "Resolving a voice". The body
    arrives in pieces as synthesis produces them, with no flag asked; a backend
    that cannot stream is served whole, so a client never branches on which
    model it is talking to. `stream_format: "sse"` sends the same audio as
    server-sent events instead: `speech.audio.delta` events carrying base64
    audio, then `speech.audio.done`.

    Explicit loading is Triton's model repository extension, with fluid's
    `resident-slot` departures: a load of what is resident changes nothing, a
    load replaces the one resident model, and a load takes no parameters.
    Models are named by their roster id.

servers:
  - url: http://127.0.0.1:8769
    description: local

paths:
  /healthz:
    get:
      operationId: getHealth
      summary: Liveness, and which model is resident.
      responses:
        "200":
          description: The server is up.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"

  /v1/models:
    get:
      operationId: listModels
      summary: Every model this server can load, and which one is loaded.
      responses:
        "200":
          description: The listing.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelList"
    delete:
      operationId: unloadModel
      summary: Drop the resident model.
      description: |
        Unloading when nothing is loaded is a no-op rather than an error: the
        caller wanted it gone, and it is. Refused while work is in flight —
        waiting out the slot's deadline would hide a caller's mistake behind a
        stall.
      responses:
        "200":
          description: Nothing is resident.
        "409":
          description: Work is in flight against the model.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      operationId: loadModelByName
      summary: Make a model resident, naming it in the query.
      description: |
        The spelling mlx-audio answers, and so the one the dashboard sends to
        every synthesis provider. Identical to `POST /v1/models/load` with the
        id in the body; the transcription server answers it the same way.
      parameters:
        - $ref: "#/components/parameters/ModelName"
      responses:
        "200":
          description: The model is loaded and ready.
        "400":
          description: No such model.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Work is in flight against the model.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/models/load:
    post:
      operationId: loadModel
      summary: Make a model resident.
      description: |
        Returns when the model is ready to serve. Loading the model already
        loaded is a no-op rather than an error. A failed load leaves nothing
        resident, which is the honest state.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ModelRequest"
      responses:
        "200":
          description: The model is loaded and ready.
        "400":
          description: No such model.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Work is in flight against the model.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v2/repository/index:
    post:
      operationId: repositoryIndex
      summary: Every roster model, and which one is resident.
      description: |
        The resident model is READY and every other UNAVAILABLE. With
        `ready: true` only the READY one is listed.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RepositoryIndexRequest"
      responses:
        "200":
          description: The index.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RepositoryIndexEntry"

  /v2/repository/models/{name}/load:
    post:
      operationId: repositoryLoad
      summary: Make a model resident, replacing whatever was.
      description: |
        A load of the resident model changes nothing. Waits behind work in
        flight, and is refused once the wait outlasts the slot's deadline.
        Any parameter is refused.
      parameters:
        - $ref: "#/components/parameters/RepositoryModelName"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RepositoryRequest"
      responses:
        "200":
          description: The model is loaded and ready.
        "400":
          description: The name is unknown, or a parameter was given.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Work in flight outlasted the wait.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: Building the model failed; nothing is resident.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v2/repository/models/{name}/unload:
    post:
      operationId: repositoryUnload
      summary: Release a model, naming it.
      description: |
        Drops the model if it is the resident one; naming another is a no-op.
      parameters:
        - $ref: "#/components/parameters/RepositoryModelName"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RepositoryRequest"
      responses:
        "200":
          description: The model is not resident.
        "400":
          description: The name is unknown.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Work is in flight against the model.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

components:
  parameters:
    RepositoryModelName:
      name: name
      in: path
      required: true
      schema:
        type: string
      description: A roster model id.
    ModelName:
      name: model_name
      in: query
      required: true
      schema:
        type: string
      description: A model id, as listed by /v1/models.

  schemas:
    Health:
      type: object
      required: [status, bundleIdentifier, shortVersion, buildVersion]
      properties:
        status:
          type: string
        model:
          type: [string, "null"]
          description: The resident model, or null when none is loaded.
        bundleIdentifier:
          type: string
          description: This server's bundle identifier, from its .app's Info.plist.
        shortVersion:
          type: string
          description: CFBundleShortVersionString — the package version this build was cut from.
        buildVersion:
          type: string
          description: CFBundleVersion — the source commit this build was made from.

    Model:
      type: object
      required: [id, name, object, created, owned_by, loaded, loadable, kind, transport, present]
      description: |
        OpenAI's model shape — id, object, created, owned_by — so a client
        written against any OpenAI-compatible server reads this without special
        cases. `loaded` and `loadable` are added rather than substituted: this
        server holds one model resident at a time, which OpenAI's shape cannot
        express. A client that ignores both sees a standard listing.
      properties:
        id:
          type: string
        name:
          type: string
          description: |
            What to call this model in a listing. Carried from the roster: a
            client asking what this server serves should not have to complete
            the answer from somewhere else.
        object:
          type: string
        created:
          type: integer
          description: |
            Seconds since the epoch. These models are not created by this
            server, so it reports process start rather than fabricating a
            per-request timestamp.
        owned_by:
          type: string
        loaded:
          type: boolean
          description: Whether this model is the resident one.
        loadable:
          type: boolean
          description: |
            Whether this model can be made resident over /v1/models/load. Every
            model in the roster is, so this is constant — it is kept because
            OpenAI-compatible clients read it, not because it discriminates.
        kind:
          type: string
          enum: [batch, streaming, both]
          description: |
            What the model is. Every synthesis model is `both`: the same driver
            answers a one-shot request and drives a stream, unlike
            transcription where the two are separate managers.
        transport:
          type: array
          minItems: 1
          items:
            type: string
            enum: [http, websocket]
          description: |
            The routes this model is reached over. Both, on one port — the file
            consumer posts, the voice loop upgrades. Reported rather than
            assumed, so a client reads it instead of knowing it.
        present:
          type: boolean
          description: |
            Whether this model's weights are in the cache root its own runtime
            reads, which for synthesis is not where the transcription models
            live. Not availability — that is a platform fact — but the one
            input only this server can contribute.
        canClone:
          type: boolean
          description: |
            Whether this model can render a voice from a reference recording.
        requiresRefText:
          type: boolean
          description: |
            Whether cloning under this model needs a transcript alongside the
            audio. False for a model that cannot clone at all.
        cloning:
          type: object
          description: |
            The full terms this model puts on a cloning reference. `canClone`
            and `requiresRefText` are the two a caller reads most often;
            everything the roster states is here, so a consumer deciding
            whether a recording will be accepted has the whole rule rather
            than the common half of it.
          properties:
            available:
              type: boolean
            requiresText:
              type: boolean
            minDurationS:
              type: number
            maxDurationS:
              type: number
            sampleRate:
              type: integer
        chunkProfile:
          type: object
          description: |
            The model's own chunker constraint. Reported because a caller
            sending more text than the model tolerates gets degraded audio
            and no error — the chunking belongs to the model, not to whoever
            is calling it.
          required: [words, chars]
          properties:
            words:
              type: integer
            chars:
              type: integer
        presetVoices:
          type: array
          description: |
            Voices this model already knows by name, needing no reference
            recording. A client offering a choice of voice reads these rather
            than being told them separately.
          items:
            type: object
            required: [id, name]
            properties:
              id:
                type: string
              name:
                type: string

    ModelList:
      type: object
      required: [object, data]
      properties:
        object:
          type: string
        data:
          type: array
          items:
            $ref: "#/components/schemas/Model"

    ModelRequest:
      type: object
      required: [model]
      properties:
        model:
          type: string
          description: A model id, as listed by /v1/models.

    RepositoryIndexRequest:
      type: object
      properties:
        ready:
          type: boolean
          description: List only the models that are READY.

    RepositoryIndexEntry:
      type: object
      required: [name, state, reason]
      properties:
        name:
          type: string
        state:
          type: string
          enum: [READY, UNAVAILABLE]
        reason:
          type: string
          description: Why the model is in its state; empty when it is READY.

    RepositoryRequest:
      type: object
      properties:
        parameters:
          type: object
          additionalProperties: true

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
          description: |
            States the condition: an unknown model, an unproducible
            response_format, or a model already busy.
